<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openclaw AI | Advanced Intelligence Autonomous Coding</title>
    <!-- Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <!-- Gumroad Overlay -->
    <script src="https://gumroad.com/js/gumroad.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --accent: #ff3344;
            --glow: #00ffff;
            --text: #fff;
            --gray: #666;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Hero Layout */
        .hero {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 5%;
            box-sizing: border-box;
        }

        /* Branding Text */
        .copy-column {
            flex: 1;
            max-width: 600px;
            z-index: 10;
        }

        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.9;
            margin: 0;
            letter-spacing: -3px;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.25rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        /* 3D Visual Column */
        .visual-column {
            flex: 1.5;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 80%;
            --poster-color: transparent;
            outline: none;
        }

        /* Pricing Card */
        .price-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            display: inline-flex;
            flex-direction: column;
            gap: 15px;
        }

        .amount {
            font-size: 3rem;
            font-weight: 900;
            font-family: 'Space Grotesk', sans-serif;
        }

        .cta {
            background: var(--text);
            color: var(--bg);
            padding: 18px 40px;
            text-decoration: none;
            font-weight: 900;
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .cta:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 51, 68, 0.4);
        }

        /* Ambient Lights */
        .glow-sphere {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 51, 68, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .nav {
            position: absolute;
            top: 40px;
            left: 5%;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="nav">
        <div class="logo-dot"></div> OPENCLAW AI
    </div>

    <div class="hero">
        <div class="glow-sphere"></div>

        <div class="copy-column">
            <div class="tagline">The Autonomous Evolution</div>
            <h1>Advanced Intelligence. Unified.</h1>
            <p>Deploy the power of agentic coding to any workstation. Openclaw AI is the ultimate bridge between human intent and autonomous execution.</p>
            
            <div class="price-tag">
                <div class="amount">$1,000.00</div>
                <a class="gumroad-button cta" href="https://hotboistep.gumroad.com/l/islqm">Enhance Your Computer</a>
            </div>
        </div>

        <div class="visual-column">
            <!-- Interative Hero Product -->
            <model-viewer 
                src="openclaw_ai.glb" 
                alt="Openclaw AI Module"
                auto-rotate 
                camera-controls 
                shadow-intensity="1" 
                exposure="1"
                interaction-prompt="none">
            </model-viewer>
        </div>
    </div>

</body>
</html>
