<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openclaw AI | Advanced Intelligence Autonomous Coding</title>
    <!-- Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <!-- Gumroad Overlay -->
    <script src="https://gumroad.com/js/gumroad.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --accent: #ff3344;
            --glow: #00ffff;
            --text: #fff;
            --gray: #666;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Hero Layout */
        .hero {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 5%;
            box-sizing: border-box;
        }

        /* Branding Text */
        .copy-column {
            flex: 1;
            max-width: 600px;
            z-index: 10;
        }

        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.9;
            margin: 0;
            letter-spacing: -3px;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.25rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        /* 3D Visual Column */
        .visual-column {
            flex: 1.5;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 80%;
            --poster-color: transparent;
            outline: none;
        }

        /* Pricing Card */
        .price-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            display: inline-flex;
            flex-direction: column;
            gap: 15px;
        }

        .amount {
            font-size: 3rem;
            font-weight: 900;
            font-family: 'Space Grotesk', sans-serif;
        }

        .cta {
            background: var(--text);
            color: var(--bg);
            padding: 18px 40px;
            text-decoration: none;
            font-weight: 900;
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .cta:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 51, 68, 0.4);
        }

        /* Ambient Lights */
        .glow-sphere {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 51, 68, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .nav {
            position: absolute;
            top: 40px;
            left: 5%;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* Toggle Switch UI */
        .view-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 50px;
            margin-left: 15px;
            font-size: 0.7rem;
            color: var(--gray);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        .switch-track {
            width: 32px;
            height: 16px;
            background: #333;
            border-radius: 10px;
            position: relative;
            transition: all 0.3s ease;
        }

        .switch-knob {
            width: 12px;
            height: 12px;
            background: var(--text);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        body.force-desktop .switch-track { background: var(--accent); }
        body.force-desktop .switch-knob { transform: translateX(16px); }
        body.force-desktop .label-desktop { color: var(--text); font-weight: 900; }
        body.mobile-active .label-mobile { color: var(--text); font-weight: 900; }

        /* Responsive Logic */
        @media (max-width: 768px) {
            body:not(.force-desktop) .hero {
                flex-direction: column;
                height: auto;
                padding: 120px 5% 50px;
                text-align: center;
            }

            body:not(.force-desktop) .copy-column {
                order: 2;
                max-width: 100%;
            }

            body:not(.force-desktop) h1 {
                font-size: 2.8rem;
                letter-spacing: -1px;
            }

            body:not(.force-desktop) p {
                margin: 0 auto 30px;
            }

            body:not(.force-desktop) .visual-column {
                order: 1;
                height: 350px;
                width: 100%;
                margin-bottom: 20px;
            }

            body:not(.force-desktop) model-viewer {
                height: 100%;
            }

            body:not(.force-desktop) .nav {
                width: 100%;
                left: 0;
                justify-content: center;
                top: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="nav">
        <div class="logo-dot"></div> OPENCLAW AI
        <div class="view-toggle" id="mode-toggle">
            <span class="label-mobile">Mobile</span>
            <div class="switch-track"><div class="switch-knob"></div></div>
            <span class="label-desktop">Desktop</span>
        </div>
    </div>

    <div class="hero">
        <div class="glow-sphere"></div>

        <div class="copy-column">
            <div class="tagline">The Autonomous Evolution</div>
            <h1>Advanced Intelligence. Unified.</h1>
            <p>Deploy the power of agentic coding to any workstation. Openclaw AI is the ultimate bridge between human intent and autonomous execution.</p>
            
            <div class="price-tag">
                <div class="amount">$499.00</div>
                <a class="gumroad-button cta" href="https://hotboistep.gumroad.com/l/islqm">Enhance Your Computer</a>
            </div>
        </div>

        <div class="visual-column">
            <!-- Interative Hero Product -->
            <model-viewer 
                src="openclaw_ai.glb" 
                alt="Openclaw AI Module"
                auto-rotate 
                camera-controls 
                shadow-intensity="1" 
                exposure="1"
                interaction-prompt="none">
            </model-viewer>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('mode-toggle');
        const body = document.body;

        // Apply initial state
        if (localStorage.getItem('force-desktop') === 'true') {
            body.classList.add('force-desktop');
        } else {
            body.classList.add('mobile-active');
        }

        toggle.addEventListener('click', () => {
            const isDesktop = body.classList.toggle('force-desktop');
            body.classList.toggle('mobile-active', !isDesktop);
            localStorage.setItem('force-desktop', isDesktop);
        });
    </script>
</body>
</html>
